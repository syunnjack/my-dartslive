<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="My Dartsliveは、ダーツ設置店を中心にボウリング、カラオケ、プライズ、ゲームセンターまで設備・大会・口コミ・クーポンで探せるUGC対応検索サービスです。"
    />
    <meta
      name="keywords"
      content="ダーツ,ボウリング,カラオケ,プリクラ,プライズ,ゲームセンター,大会,クーポン,口コミ,UGC"
    />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <link rel="canonical" href="https://dartspot.jp/" />
    <meta property="og:title" content="My Dartslive | ダーツ設置店・大会・クーポン検索" />
    <meta
      property="og:description"
      content="遊べる施設を、駅近、設備、イベント、口コミ、クーポン、収益導線つきで比較。"
    />
    <meta property="og:url" content="https://dartspot.jp/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="My Dartslive" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "My Dartslive",
        "url": "https://dartspot.jp/",
        "inLanguage": "ja",
        "description": "ダーツ設置店を中心に、遊べるアミューズ施設を探せる検索サービス。",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://dartspot.jp/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "My Dartsliveとは？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "ダーツ設置店を中心に、駅、設備、料金、イベント、口コミで遊べる施設を探せるサービスです。"
            }
          },
          {
            "@type": "Question",
            "name": "UGCでは何を集めますか？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "設置機種、混雑、料金、クーポン、大会、閉店、メンテナンス、景品入荷などの現地情報を集めます。"
            }
          },
          {
            "@type": "Question",
            "name": "収益導線は何ですか？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "店舗送客広告、クーポン、予約、イベント告知、スポンサー枠、確認済み掲載、物販アフィリエイトで収益化します。"
            }
          }
        ]
      }
    </script>
    <title>My Dartslive | ダーツ設置店・大会・クーポン検索</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
